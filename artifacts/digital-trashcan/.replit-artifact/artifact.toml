kind = "web"
previewPath = "/"
title = "Digital Trashcan"
version = "1.0.0"
id = "artifacts/digital-trashcan"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25657

[services.development]
run = "pnpm --filter @workspace/digital-trashcan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-trashcan", "run", "build" ]
publicDir = "artifacts/digital-trashcan/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25657"
BASE_PATH = "/"
